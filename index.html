<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Auditoría 2026-07-30: se saca `maximum-scale=1.0, user-scalable=no`.
         Bloquear el zoom estaba puesto para tapar el auto-zoom de iOS al
         enfocar un input, pero la causa real era otra: los inputs estaban a
         15px y iOS hace zoom con cualquier campo por debajo de 16px. Ahora
         los inputs son de 16px (ver `inp` en theme.js), así que el auto-zoom
         no ocurre y el alumno recupera el derecho a agrandar la pantalla. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Desarrollo Integral</title>
    <meta name="description" content="Panel de alumnos de Desarrollo Integral — entrenamiento, rehabilitación y seguimiento personalizado." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA (ronda 8): instalable en el teléfono -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DI" />

    <!-- Open Graph / WhatsApp / Facebook — ronda 12: la imagen (og-image.png)
         quedó solo con el ícono, sin texto quemado. El título/subtítulo van
         acá aparte, coherentes con el subtítulo del login ("App de Entrenamiento"). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Desarrollo Integral" />
    <meta property="og:description" content="App de Entrenamiento" />
    <meta property="og:image" content="https://app-desarrollo-integral.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://app-desarrollo-integral.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Desarrollo Integral" />
    <meta name="twitter:description" content="App de Entrenamiento" />
    <meta name="twitter:image" content="https://app-desarrollo-integral.vercel.app/og-image.png" />
    <style>
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Light.otf") format("opentype");
        font-weight: 300 400;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Medium.otf") format("opentype");
        font-weight: 500 600;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Extrabold.otf") format("opentype");
        font-weight: 700 900;
        font-display: swap;
      }
      /* Ronda 16: identidad tipográfica formal de la app — 2 niveles.
         DISPLAY (títulos de pantalla, nombres de sección, el wordmark en
         sí): "PP Formula Condensed", el mismo peso condensado bold recto
         que se usó para dibujar los paths de "INTEGRAL" en el SVG del
         logo (DIWordmark.jsx) — nunca se había cargado como fuente web,
         solo existía quemado en el vector. BODY (todo lo demás: labels,
         botones, inputs, texto de UI): "PP Formula" normal, ya cargada
         arriba y ya aplicada como fuente base del <body> desde antes.
         Ver FONT_DISPLAY / FONT_BODY en src/utils/theme.js. */
      @font-face {
        font-family: "PP Formula Condensed";
        src: url("/fonts/PPFormula-CondensedBlack.otf") format("opentype");
        font-weight: 700 900;
        font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Auditoría 2026-07-30: el <html> no declaraba `font-family`, así que
         todo lo que no heredaba de <body> caía al serif por defecto del
         navegador — se midieron 27 elementos renderizando en Times New
         Roman en producción. Se declara acá para que no quede ningún hueco. */
      html {
        -webkit-text-size-adjust: 100%;
        font-family: "PP Formula", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      /* Ronda 18 decía: "la fuente base de la UI pasa a la sans del sistema,
         Lucas marcó que PP Formula no se lee en cuerpos chicos".
         Auditoría 2026-07-30 — la causa estaba mal atribuida: PP Formula no
         se leía porque el cuerpo estaba a 10-13px (se midieron 71 de 99
         elementos por debajo de 16px en la vista del alumno). Con la escala
         nueva (piso de 15px en UI, 16px en lectura e inputs) PP Formula
         Medium sí se entiende, y el Brand Kit v1.0 la pide como fuente de
         cuerpo. Si en algún cuerpo puntual siguiera costando leerla, se baja
         ESE caso a FONT_UI — no se cambia la base de toda la app. */
      body {
        background: #000;
        font-family: "PP Formula", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        color: #f0f0f0;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      input, textarea, select, button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
