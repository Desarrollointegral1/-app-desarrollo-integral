<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Rehab Integral</title>
    <meta name="description" content="Pacientes y ejercicios de rehabilitación — kinesiología y osteopatía." />
    <meta name="theme-color" content="#F2EEE8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      /* Misma familia que la app de entrenamiento (es la marca de la casa),
         pero acá se usan los pesos finos: el título de pantalla va en Light
         300 y en minúscula, donde el gimnasio grita en condensada negra. */
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Light.otf") format("opentype");
        font-weight: 300 400;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Medium.otf") format("opentype");
        font-weight: 500 600;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Formula";
        src: url("/fonts/PPFormula-Extrabold.otf") format("opentype");
        font-weight: 700 900;
        font-display: swap;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        background: #F2EEE8;
        color: #16150F;
        font-family: "PP Formula", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-weight: 500;
        -webkit-font-smoothing: antialiased;
      }
      input, textarea, select, button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
